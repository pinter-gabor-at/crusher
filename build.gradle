plugins {
	id 'java-library'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'idea'
}

version = mod_version + "+fabric+mc" + minecraft_version
group = mod_group

base {
	archivesName = project.mod_id
}

loom {
	accessWidenerPath = file("src/main/resources/${mod_group}.classtweaker")
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'REI and Cloth Config'
		url = 'https://maven.shedaniel.me'
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file.
	minecraft "com.mojang:minecraft:${minecraft_version}"
	// Fabric loader.
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	// Fabric API.
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	// Compile against the REI API but do not include it at runtime.
	compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
	compileOnly("me.shedaniel.cloth:basic-math:+")
	include api("dev.architectury:architectury-fabric:+")
	// At runtime, use the full REI.
	runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
}

idea {
	module {
		// Download sources/javadoc jars for dependencies.
		downloadSources = true
		downloadJavadoc = true
	}
}

processResources {
	filesMatching("fabric.mod.json") {
		expand "mod_group": mod_group,
			"mod_id": mod_id,
			"mod_version": mod_version,
			"version": version,
			"minecraft_version": minecraft_version,
			"minecraft_version_range": minecraft_version_range,
			"loader_version": loader_version,
			"fabric_version": fabric_version,
			"rei_version": rei_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
	from("LICENSE")
	exclude(".cache")
}
